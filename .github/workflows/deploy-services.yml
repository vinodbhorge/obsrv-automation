name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (bootstrap, coredb, kafka40, migrations, monitoring, coreinfra, obsrvapis, hudi, otel, oauth, obsrvtools, additional, core-setup, all)'
        required: true
        default: 'all'
      cloud_env:
        description: 'Cloud environment (aws, gcp, azure, local)'
        required: true
        default: 'aws'
      cluster_name:
        description: 'EKS cluster name'
        required: true
      aws_region:
        description: 'AWS region'
        required: true
        default: 'ap-south-1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.17.2'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ inputs.cluster_name }} --region ${{ vars.AWS_REGION }}
          kubectl get nodes

      - name: Deploy services
        working-directory: helmcharts/kitchen
        env:
          cloud_env: ${{ inputs.cloud_env }}
        run: |
          chmod +x install.sh
          ./install.sh ${{ inputs.service }}
