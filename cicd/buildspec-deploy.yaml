version: 0.2

env:
  variables:
    CLUSTER_NAME: "sb-dev-cluster"
    AWS_DEFAULT_REGION: "us-east-1"
    # Optionally set TARGET_ROLE_NAME here, or pass ASSUME_ROLE_ARN directly as a secured env var.
    # TARGET_ROLE_NAME: "CodeBuildCrossAccountEKSRole"

phases:
  install:
    runtime-versions: {}
    commands:
      - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      - unzip -q awscliv2.zip
      - sudo ./aws/install --update
      - aws --version

      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - sudo mv kubectl /usr/local/bin/
      - kubectl version --client

      - curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - helm version

      - sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
      - sudo chmod +x /usr/bin/yq
      - yq --version

      # jq for parsing STS output
      - (sudo yum install -y jq || (sudo apt-get update -y && sudo apt-get install -y jq)) || true

  pre_build:
    commands:
      - set -eu
      - cd helmcharts/kitchen
      - chmod +x install.sh

      - echo "Checking AWS identity before assume-role (pipeline account)..."
      - aws sts get-caller-identity

      - echo "Using target account from pipeline parameter"
      - export TARGET_ACCOUNT_ID="$TF_VAR_aws_account_id"


      # Build role ARN from account id if not provided via env
      - |
        if [ -z "${ASSUME_ROLE_ARN:-}" ]; then
          TARGET_ROLE_NAME="${TARGET_ROLE_NAME:-lms-cross-account-codebuild-role}"
          export ASSUME_ROLE_ARN="arn:aws:iam::${TARGET_ACCOUNT_ID}:role/${TARGET_ROLE_NAME}"
        fi
      - echo "Assuming into target role $ASSUME_ROLE_ARN"

      # If your org requires ExternalId, add: --external-id "$ASSUME_ROLE_EXTERNAL_ID"
      - CREDS_JSON=$(aws sts assume-role --role-arn "$ASSUME_ROLE_ARN" --role-session-name codebuild-cross-account --duration-seconds 3600)
      - export AWS_ACCESS_KEY_ID=$(echo "$CREDS_JSON" | jq -r .Credentials.AccessKeyId)
      - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS_JSON" | jq -r .Credentials.SecretAccessKey)
      - export AWS_SESSION_TOKEN=$(echo "$CREDS_JSON" | jq -r .Credentials.SessionToken)

      - echo "Caller (target account) after assume-role:"
      - aws sts get-caller-identity

      - echo "Listing EKS clusters in target account/region..."
      - aws eks list-clusters --region "$AWS_DEFAULT_REGION"

      - echo "Describing target cluster..."
      - aws eks describe-cluster --region "$AWS_DEFAULT_REGION" --name "$CLUSTER_NAME"

      - echo "Updating kubeconfig for kubectl/helm..."
      - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$CLUSTER_NAME"
      - kubectl get nodes

  build:
    on-failure: ABORT
    commands:
      - export cloud_env=aws
      # Install ExternalSecrets operator
      - helm repo add external-secrets https://charts.external-secrets.io
      - helm upgrade -i external-secrets external-secrets/external-secrets -n external-secrets --create-namespace --wait
      - kubectl wait --for condition=established --timeout=60s crd/externalsecrets.external-secrets.io
      - kubectl wait --for condition=established --timeout=60s crd/clustersecretstores.external-secrets.io
      - time ./install.sh core-setup
      - time ./install.sh all
      # Fetch Cognito secrets from Secrets Manager (same account as CodeBuild role - no cross-account KMS issue)
      # SUPERSET_SECRET_NAME is passed as a pipeline parameter per environment e.g. lms/dev/superset-cognito
      - echo "Fetching Cognito secrets from Secrets Manager..."
      - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
      - aws sts get-caller-identity
      - echo "SUPERSET_SECRET_NAME=[${SUPERSET_SECRET_NAME}]"
      - SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SUPERSET_SECRET_NAME" --region us-east-1 --query SecretString --output text) && echo "Secret fetched successfully" || (echo "ERROR fetching secret" && exit 1)
      - SECRET_JSON=$(echo $SECRET_JSON | tr -d '\000-\037')
      - COGNITO_CLIENT_ID=$(echo $SECRET_JSON | jq -r '.COGNITO_CLIENT_ID')
      - COGNITO_CLIENT_SECRET=$(echo $SECRET_JSON | jq -r '.COGNITO_CLIENT_SECRET')
      - COGNITO_CUSTOM_DOMAIN=$(echo $SECRET_JSON | jq -r '.COGNITO_CUSTOM_DOMAIN')
      - COGNITO_REDIRECT_URL=$(echo $SECRET_JSON | jq -r '.COGNITO_REDIRECT_URL')
      - COGNITO_USERPOOL_ID=$(echo $SECRET_JSON | jq -r '.COGNITO_USERPOOL_ID')
      - COGNITO_DOMAIN=$(echo $SECRET_JSON | jq -r '.COGNITO_DOMAIN')
      - COGNITO_REGION=$(echo $SECRET_JSON | jq -r '.COGNITO_REGION')
      - COGNITO_DEFAULT_ROLE=$(echo $SECRET_JSON | jq -r '.COGNITO_DEFAULT_ROLE')
      - DB_USER=$(echo $SECRET_JSON | jq -r '.SUPERSET_DB_USER')
      - DB_PASS=$(echo $SECRET_JSON | jq -r '.SUPERSET_DB_PASS')
      - echo "COGNITO_CLIENT_ID=$(echo $COGNITO_CLIENT_ID | cut -c1-5)... COGNITO_CUSTOM_DOMAIN=$COGNITO_CUSTOM_DOMAIN"
      # Re-assume cross-account role so kubectl can authenticate to EKS
      - CREDS_JSON=$(aws sts assume-role --role-arn "arn:aws:iam::${TF_VAR_aws_account_id}:role/lms-cross-account-codebuild-role" --role-session-name codebuild-kubectl-patch --duration-seconds 900)
      - export AWS_ACCESS_KEY_ID=$(echo $CREDS_JSON | jq -r .Credentials.AccessKeyId)
      - export AWS_SECRET_ACCESS_KEY=$(echo $CREDS_JSON | jq -r .Credentials.SecretAccessKey)
      - export AWS_SESSION_TOKEN=$(echo $CREDS_JSON | jq -r .Credentials.SessionToken)
      - aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME"
      - kubectl create secret generic superset-env --namespace superset --from-literal=COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" --from-literal=COGNITO_CLIENT_SECRET="$COGNITO_CLIENT_SECRET" --from-literal=COGNITO_CUSTOM_DOMAIN="$COGNITO_CUSTOM_DOMAIN" --from-literal=COGNITO_REDIRECT_URL="$COGNITO_REDIRECT_URL" --from-literal=COGNITO_USERPOOL_ID="$COGNITO_USERPOOL_ID" --from-literal=COGNITO_DOMAIN="$COGNITO_DOMAIN" --from-literal=COGNITO_REGION="$COGNITO_REGION" --from-literal=COGNITO_DEFAULT_ROLE="$COGNITO_DEFAULT_ROLE" --from-literal=DB_USER="$DB_USER" --from-literal=DB_PASS="$DB_PASS" --from-literal=DB_HOST="postgresql-hl.postgresql.svc.cluster.local" --from-literal=DB_PORT="5432" --from-literal=DB_NAME="superset" --from-literal=REDIS_HOST="valkey-dedup-headless.redis.svc.cluster.local" --from-literal=REDIS_PORT="6379" --dry-run=client -o yaml | kubectl apply -f -
      - echo "superset-env secret patched successfully"
      - kubectl rollout restart deployment/superset -n superset
      - kubectl rollout status deployment/superset -n superset --timeout=300s || echo "Rollout still in progress - pod was Running/Ready, continuing"

  post_build:
    commands:
      - echo "Deployment completed successfully."